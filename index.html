<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TurboEgypt - ACCELERATE THE LEGACY</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Orbitron:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,
body{
animation:fadeIn .9s ease;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(8px);
}
to{
opacity:1;
transform:translateY(0);
}
}

body{
width:100%;
overflow-x:hidden;
}

body{
font-family:'Cairo',sans-serif;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:25px 15px;
background:#020712;
position:relative;
color:white;
}

/* الخلفية */
body::before{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(circle at top right,#0f5eff55,transparent 30%),
radial-gradient(circle at bottom left,#00a2ff33,transparent 30%),
linear-gradient(to bottom,#020712,#07172f,#0f4bcc);
z-index:-3;
}

/* خطوط HUD */
.grid{
position:fixed;
inset:0;
background-image:
linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
background-size:38px 38px;
opacity:.35;
z-index:-2;
}

/* إضاءة نيون */
.glow{
position:fixed;
width:450px;
height:450px;
background:#1565ff12;
border-radius:50%;
filter:blur(120px);
top:-150px;
right:-100px;
z-index:-1;
animation:floatGlow 7s ease-in-out infinite;
}

@keyframes floatGlow{
0%{transform:translateY(0px);}
50%{transform:translateY(20px);}
100%{transform:translateY(0px);}
}

.dashboard{
width:100%;
max-width:430px;
}

.panel{
background:rgba(255,255,255,.05);
border:1px solid rgba(91,169,255,.18);
backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);
border-radius:30px;
padding:32px 22px;
box-shadow:
0 0 18px rgba(15,94,255,.12),
0 18px 45px rgba(0,0,0,.45);
}

/* عداد التيربو */
.rpm-wrap{
position:relative;
width:300px;
height:300px;
margin:auto;
margin-bottom:28px;
display:flex;
justify-content:center;
align-items:center;
border-radius:50%;
background:transparent;
border:none;
box-shadow:none;
}

.rpm-wrap::before{
display:none;
}

@keyframes spin{
from{transform:rotate(0deg);}
to{transform:rotate(360deg);}
}

.logo{
position:relative;
filter:drop-shadow(0 0 30px rgba(91,169,255,.45));
z-index:5;
width:240px;
height:240px;
object-fit:cover;
border-radius:24px;
border:2px solid rgba(255,255,255,.1);
box-shadow:0 0 18px rgba(91,169,255,.35);
}

.speed-lines{
display:none;
}

.speed-lines span{
position:absolute;
width:4px;
height:18px;
background:#5ba9ff;
left:50%;
top:10px;
transform-origin:center 95px;
box-shadow:0 0 10px #5ba9ff;
border-radius:4px;
}

.speed-lines span:nth-child(1){transform:translateX(-50%) rotate(0deg);}
.speed-lines span:nth-child(2){transform:translateX(-50%) rotate(30deg);}
.speed-lines span:nth-child(3){transform:translateX(-50%) rotate(60deg);}
.speed-lines span:nth-child(4){transform:translateX(-50%) rotate(90deg);}
.speed-lines span:nth-child(5){transform:translateX(-50%) rotate(120deg);}
.speed-lines span:nth-child(6){transform:translateX(-50%) rotate(150deg);}
.speed-lines span:nth-child(7){transform:translateX(-50%) rotate(180deg);}
.speed-lines span:nth-child(8){transform:translateX(-50%) rotate(210deg);}
.speed-lines span:nth-child(9){transform:translateX(-50%) rotate(240deg);}
.speed-lines span:nth-child(10){transform:translateX(-50%) rotate(270deg);}
.speed-lines span:nth-child(11){transform:translateX(-50%) rotate(300deg);}
.speed-lines span:nth-child(12){transform:translateX(-50%) rotate(330deg);}


.title{
font-family:'Orbitron',sans-serif;
font-size:30px;
font-weight:800;
text-align:center;
margin-bottom:8px;
letter-spacing:1px;
color:#f5f9ff;
text-shadow:0 2px 8px rgba(0,0,0,.35);
}

.subtitle{
text-align:center;
font-size:12px;
letter-spacing:3px;
color:#b7d6ff;
margin-bottom:32px;
font-family:'Orbitron',sans-serif;
}

.links{
display:flex;
flex-direction:column;
gap:15px;
}

.btn{
position:relative;
display:flex;
justify-content:center;
align-items:center;
text-decoration:none;
color:white;
padding:18px;
border-radius:18px;
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.15);
font-size:16px;
font-weight:700;
overflow:hidden;
transition:.35s;
box-shadow:0 0 18px rgba(15,94,255,.18);
}

.btn::before{
content:"";
position:absolute;
inset:0;
background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);
transform:translateX(-120%);
transition:.7s;
}

.btn:hover::before{
transform:translateX(120%);
}

.btn:hover{
transform:translateY(-3px);
box-shadow:0 0 14px rgba(91,169,255,.18);
}

.btn i{
position:absolute;
right:18px;
font-size:20px;
color:#8cc7ff;
}

.footer{
margin-top:34px;
text-align:center;
font-size:11px;
color:rgba(255,255,255,.35);
font-family:'Orbitron',sans-serif;
letter-spacing:2px;
}

@media(max-width:480px){

.panel{
padding:28px 18px;
border-radius:24px;
}

.rpm-wrap{
width:260px;
height:260px;
}

.logo{
width:180px;
height:180px;
}

.title{
font-size:24px;
}

.btn{
padding:16px;
font-size:15px;
}

}


/* Premium extra glow */
.glow2{
position:fixed;
width:300px;
height:300px;
background:#5ba9ff10;
border-radius:50%;
filter:blur(100px);
bottom:-100px;
left:-80px;
z-index:-1;
animation:floatGlow 9s ease-in-out infinite;
}

/* Logo pulse */
.logo{
animation:logoPulse 3s ease-in-out infinite;
}

@keyframes logoPulse{
0%{transform:scale(1);}
50%{transform:scale(1.03);}
100%{transform:scale(1);}
}

/* Neon underline */
.title::after{
content:"";
display:block;
width:80px;
height:3px;
margin:12px auto 0;
border-radius:999px;
background:linear-gradient(90deg,#5ba9ff,#ffffff,#5ba9ff);
box-shadow:0 0 12px #5ba9ff;
}

</style>
</head>
