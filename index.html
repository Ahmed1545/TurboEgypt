<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TurboEgypt - ACCELERATE THE LEGACY</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Orbitron:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* تصفير الإعدادات الافتراضية */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    animation: fadeIn .9s ease;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(8px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* إعدادات الجسم الأساسية ومنع التمدد الأفقي */
body {
    font-family: 'Cairo', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px 15px;
    background: #020712;
    position: relative;
    color: white;
    overflow-x: hidden;
}

/* الخلفية المضيئة */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, #0f172a 0%, #020712 70%);
    z-index: -1;
}

/* الحاوية الرئيسية للتوسيط */
.container {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 600px;
    gap: 30px;
    z-index: 1;
}

/* تعديل الشعار ليكون متجاوباً بدلاً من حجم ثابت */
.logo {
    width: 100%;
    max-width: 220px; /* أقصى عرض للشعار */
    height: auto;     /* الحفاظ على نسبة الطول والعرض */
}

/* حاوية العداد الدائرية */
.rpm-wrap {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    /* التعديل الجوهري: استخدام عرض مرن مع حد أقصى */
    width: 85vw;
    max-width: 320px; 
    aspect-ratio: 1 / 1; /* إجبار الحاوية على شكل مربع لضمان الدوران المثالي */
    border-radius: 50%;
    background: rgba(2, 7, 18, 0.8);
    border: 2px solid rgba(0, 255, 255, 0.4);
    box-shadow: 0 0 25px rgba(0, 255, 255, 0.2), inset 0 0 15px rgba(0, 255, 255, 0.1);
}

/* تأثير النيون الداخلي والخارجي - الآن يتجاوب مع الحاوية */
.glow, .glow2 {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    z-index: -1;
}

.glow {
    width: 140%; /* أكبر من الحاوية الأصلية بنسبة مئوية بدلا من 450px */
    height: 140%;
    background: radial-gradient(circle, rgba(0, 255, 255, 0.1) 0%, transparent 65%);
}

.glow2 {
    width: 110%;
    height: 110%;
    background: radial-gradient(circle, rgba(0, 255, 255, 0.2) 0%, transparent 60%);
}

/* إعدادات النصوص */
.title-en {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(1.2rem, 5vw, 2.2rem); /* خط يتمدد وينكمش حسب الشاشة */
    text-align: center;
    color: #00ffff;
    letter-spacing: 2px;
    text-shadow: 0 0 15px rgba(0, 255, 255, 0.6);
}

.rpm-number {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(2.5rem, 8vw, 4rem);
    font-weight: 800;
    color: white;
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
}

.rpm-text {
    font-size: 1.2rem;
    color: rgba(255, 255, 255, 0.7);
    margin-top: -10px;
}

/* تعديلات خاصة للشاشات الصغيرة جداً إن لزم الأمر */
@media (max-width: 480px) {
    .container {
        gap: 20px;
    }
    .logo {
        max-width: 180px;
    }
}
</style>
</head>
<body>

<div class="container">
    
    <h1 class="title-en" style="color: white; text-shadow: none; font-size: 2.5rem;">Turbo<span style="color:#00ffff;">Egypt</span></h1>

    <div class="rpm-wrap">
        <div class="glow"></div>
        <div class="glow2"></div>
        
        <div style="text-align: center; z-index: 2;">
            <div class="rpm-number">8500</div>
            <div class="rpm-text">RPM</div>
        </div>
    </div>

    <h2 class="title-en" style="font-size: clamp(1rem, 4vw, 1.5rem); margin-top: 10px;">ACCELERATE THE LEGACY</h2>
</div>

</body>
</html>
